[package]
name = "analyzer"
version = "0.1.0"
edition = "2021"
description = "Rust analysis backend for KashCompiler – pluggable LLM-powered algorithms"

[[bin]]
name = "analyzer"
path = "src/main.rs"

[dependencies]
# HTTP client for LLM API calls
reqwest = { version = "0.11", features = ["json"] }
# Async trait support
async-trait = "0.1"
# JSON serialization / deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime
tokio = { version = "1", features = ["full"] }
# Error handling
anyhow = "1"
# UUID generation
uuid = { version = "1", features = ["v4"] }
# Timestamp handling
chrono = { version = "0.4", features = ["serde"] }
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
# Environment variable loading
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
